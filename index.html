<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor Web STL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111827;
      color: #ffffff;
      overflow: hidden;
    }
    .toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 360px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .section-title {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid #374151;
      font-size: 16px;
      font-weight: bold;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #d1d5db;
    }
    input, select, button { width: 100%; }
    input[type="file"],
    input[type="number"],
    select {
      padding: 8px;
      background: #1f2937;
      color: white;
      border: 1px solid #374151;
      border-radius: 10px;
    }
    input[type="color"] {
      height: 40px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button {
      padding: 10px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
    }
    button:hover { background: #1d4ed8; }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.45;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Visor Web STL</h1>

    <div class="field">
      <label for="fileInput">Cargar archivo STL</label>
      <input id="fileInput" type="file" accept=".stl" />
    </div>

    <div class="field">
      <label for="colorInput">Color de la pieza</label>
      <input id="colorInput" type="color" value="#1e90ff" />
    </div>

    <div class="field">
      <label for="metalnessInput">Metalizado</label>
      <input id="metalnessInput" type="range" min="0" max="1" step="0.01" value="0.15" />
    </div>

    <div class="field">
      <label for="roughnessInput">Rugosidad</label>
      <input id="roughnessInput" type="range" min="0" max="1" step="0.01" value="0.45" />
    </div>

    <div class="field">
      <label for="scaleInput">Escala del STL</label>
      <select id="scaleInput">
        <option value="1">El STL está en mm</option>
        <option value="25.4">El STL está en pulgadas</option>
        <option value="1000">El STL está en metros</option>
      </select>
    </div>

    <div class="field">
      <label for="densityInput">Densidad kg/m³</label>
      <input id="densityInput" type="number" value="950" min="1" step="1" />
    </div>

    <button id="resetButton">Centrar modelo</button>

    <div class="status" id="status">Arrastra para rotar. Usa la rueda para zoom.</div>
    <div class="status" id="dimensionsBox">Carga un STL para ver dimensiones, volumen y peso.</div>

    <div class="section-title">Regla / Medición pro</div>
    <button id="measureButton">Activar regla click a click</button>
    <button id="clearMeasureButton">Limpiar mediciones</button>
    <button id="exportMeasureButton">Exportar mediciones CSV</button>
    <div class="status" id="measureHistoryBox">Historial de mediciones: vacío.</div>

    <div class="section-title">Corte de sección</div>
    <div class="field">
      <label for="sectionAxis">Eje de corte</label>
      <select id="sectionAxis">
        <option value="none">Sin corte</option>
        <option value="x">Cortar en eje X</option>
        <option value="y">Cortar en eje Y</option>
        <option value="z">Cortar en eje Z</option>
      </select>
    </div>

    <div class="field">
      <label for="sectionSlider">Posición del corte</label>
      <input id="sectionSlider" type="range" min="-100" max="100" step="1" value="0" />
    </div>

    <div class="section-title">Simulación simple tipo ANSYS</div>
    <div class="field">
      <label for="loadAxis">Dirección de carga</label>
      <select id="loadAxis">
        <option value="y">Carga vertical Y</option>
        <option value="x">Carga lateral X</option>
        <option value="z">Carga lateral Z</option>
      </select>
    </div>

    <div class="field">
      <label for="pressureInput">Presión aplicada MPa</label>
      <input id="pressureInput" type="number" value="0.7" min="0" step="0.01" />
    </div>

    <div class="field">
      <label for="elasticModulusInput">Módulo elástico MPa</label>
      <input id="elasticModulusInput" type="number" value="900" min="1" step="10" />
    </div>

    <div class="field">
      <label for="yieldStressInput">Límite admisible MPa</label>
      <input id="yieldStressInput" type="number" value="22" min="1" step="1" />
    </div>

    <div class="field">
      <label for="deformationScaleInput">Escala visual de deformación</label>
      <input id="deformationScaleInput" type="range" min="0" max="50" step="1" value="10" />
    </div>

    <button id="runSimulationButton">Ejecutar simulación simple</button>
    <button id="resetSimulationButton">Restaurar geometría</button>
    <div class="status" id="simulationBox">Resultados de simulación: sin ejecutar.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";

    let scene, camera, renderer, controls;
    let currentMesh = null;
    let originalGeometry = null;

    let measureMode = false;
    let measurePoints = [];
    let measureLines = [];
    let pointMarkers = [];
    let measurements = [];
    let measureCounter = 1;

    let sectionPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
    let sectionHelper = null;

    const fileInput = document.getElementById("fileInput");
    const colorInput = document.getElementById("colorInput");
    const metalnessInput = document.getElementById("metalnessInput");
    const roughnessInput = document.getElementById("roughnessInput");
    const scaleInput = document.getElementById("scaleInput");
    const densityInput = document.getElementById("densityInput");
    const resetButton = document.getElementById("resetButton");
    const status = document.getElementById("status");
    const dimensionsBox = document.getElementById("dimensionsBox");

    const measureButton = document.getElementById("measureButton");
    const clearMeasureButton = document.getElementById("clearMeasureButton");
    const exportMeasureButton = document.getElementById("exportMeasureButton");
    const measureHistoryBox = document.getElementById("measureHistoryBox");

    const sectionAxis = document.getElementById("sectionAxis");
    const sectionSlider = document.getElementById("sectionSlider");

    const loadAxis = document.getElementById("loadAxis");
    const pressureInput = document.getElementById("pressureInput");
    const elasticModulusInput = document.getElementById("elasticModulusInput");
    const yieldStressInput = document.getElementById("yieldStressInput");
    const deformationScaleInput = document.getElementById("deformationScaleInput");
    const runSimulationButton = document.getElementById("runSimulationButton");
    const resetSimulationButton = document.getElementById("resetSimulationButton");
    const simulationBox = document.getElementById("simulationBox");

    const material = new THREE.MeshStandardMaterial({
      color: colorInput.value,
      metalness: Number(metalnessInput.value),
      roughness: Number(roughnessInput.value),
      side: THREE.DoubleSide
    });

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111827);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000000);
      camera.position.set(120, 120, 120);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.localClippingEnabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
      keyLight.position.set(120, 180, 100);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
      fillLight.position.set(-100, 80, -100);
      scene.add(fillLight);

      scene.add(new THREE.GridHelper(300, 30, 0x6b7280, 0x374151));

      window.addEventListener("resize", onWindowResize);
      renderer.domElement.addEventListener("click", onMeasureClick);

      fileInput.addEventListener("change", loadSTLFile);
      colorInput.addEventListener("input", updateMaterial);
      metalnessInput.addEventListener("input", updateMaterial);
      roughnessInput.addEventListener("input", updateMaterial);
      scaleInput.addEventListener("change", showDimensions);
      densityInput.addEventListener("input", showDimensions);
      resetButton.addEventListener("click", centerModel);

      measureButton.addEventListener("click", toggleMeasureMode);
      clearMeasureButton.addEventListener("click", clearMeasurement);
      exportMeasureButton.addEventListener("click", exportMeasurementsCSV);

      sectionAxis.addEventListener("change", updateSectionCut);
      sectionSlider.addEventListener("input", updateSectionCut);

      runSimulationButton.addEventListener("click", runSimpleSimulation);
      resetSimulationButton.addEventListener("click", function () {
        resetSimulation(true);
      });
    }

    function loadSTLFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      const loader = new STLLoader();
      status.textContent = "Cargando modelo...";

      reader.onload = function (e) {
        try {
          const geometry = loader.parse(e.target.result);
          geometry.computeVertexNormals();
          geometry.computeBoundingBox();

          if (currentMesh) {
            scene.remove(currentMesh);
            currentMesh.geometry.dispose();
          }

          clearMeasurement();
          removeSectionHelper();

          originalGeometry = geometry.clone();
          currentMesh = new THREE.Mesh(geometry, material);
          scene.add(currentMesh);

          centerModel();
          originalGeometry = currentMesh.geometry.clone();
          showDimensions();
          updateSectionCut();

          status.textContent = "Modelo cargado: " + file.name;
          simulationBox.textContent = "Resultados de simulación: sin ejecutar.";
        } catch (error) {
          console.error(error);
          status.textContent = "No se pudo cargar el STL. Verifica que el archivo sea válido.";
        }
      };

      reader.onerror = function () {
        status.textContent = "Error al leer el archivo STL.";
      };

      reader.readAsArrayBuffer(file);
    }

    function updateMaterial() {
      material.color.set(colorInput.value);
      material.metalness = Number(metalnessInput.value);
      material.roughness = Number(roughnessInput.value);
      material.needsUpdate = true;
    }

    function centerModel() {
      if (!currentMesh) return;

      currentMesh.geometry.computeBoundingBox();
      const box = currentMesh.geometry.boundingBox;
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDimension = Math.max(size.x, size.y, size.z) || 1;

      currentMesh.geometry.translate(-center.x, -center.y, -center.z);
      currentMesh.geometry.computeBoundingBox();
      currentMesh.geometry.computeVertexNormals();
      currentMesh.position.set(0, 0, 0);

      const distance = maxDimension * 2.5;
      camera.position.set(distance, distance * 0.75, distance);
      camera.near = Math.max(maxDimension / 1000, 0.01);
      camera.far = maxDimension * 1000;
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.update();
    }

    function showDimensions() {
      if (!currentMesh) return;

      currentMesh.geometry.computeBoundingBox();
      const box = currentMesh.geometry.boundingBox;
      const size = box.getSize(new THREE.Vector3());
      const scaleToMM = Number(scaleInput.value);
      const density = Number(densityInput.value) || 950;

      const xMM = size.x * scaleToMM;
      const yMM = size.y * scaleToMM;
      const zMM = size.z * scaleToMM;

      const volumeModelUnits3 = Math.abs(calculateMeshVolume(currentMesh.geometry));
      const volumeMM3 = volumeModelUnits3 * Math.pow(scaleToMM, 3);
      const volumeCM3 = volumeMM3 / 1000;
      const volumeM3 = volumeMM3 / 1000000000;
      const weightKG = volumeM3 * density;

      dimensionsBox.innerHTML =
        "<strong>Dimensiones:</strong><br>" +
        "X / Largo: " + xMM.toFixed(2) + " mm<br>" +
        "Y / Alto: " + yMM.toFixed(2) + " mm<br>" +
        "Z / Ancho: " + zMM.toFixed(2) + " mm<br><br>" +
        "<strong>Volumen aproximado:</strong><br>" + volumeCM3.toFixed(2) + " cm³<br><br>" +
        "<strong>Peso estimado:</strong><br>" + weightKG.toFixed(4) + " kg<br>" +
        "<small>Densidad: " + density + " kg/m³</small>";
    }

    function calculateMeshVolume(geometry) {
      const position = geometry.attributes.position;
      let volume = 0;

      const p1 = new THREE.Vector3();
      const p2 = new THREE.Vector3();
      const p3 = new THREE.Vector3();
      const cross = new THREE.Vector3();

      for (let i = 0; i < position.count; i += 3) {
        p1.fromBufferAttribute(position, i);
        p2.fromBufferAttribute(position, i + 1);
        p3.fromBufferAttribute(position, i + 2);
        cross.crossVectors(p2, p3);
        volume += p1.dot(cross) / 6.0;
      }

      return volume;
    }

    function toggleMeasureMode() {
      measureMode = !measureMode;
      measureButton.textContent = measureMode ? "Regla activa: selecciona 2 puntos" : "Activar regla click a click";
      measureButton.style.background = measureMode ? "#16a34a" : "#2563eb";
    }

    function onMeasureClick(event) {
      if (!measureMode || !currentMesh) return;

      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -((event.clientY - rect.top) / rect.height) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentMesh, false);

      if (intersects.length === 0) return;

      measurePoints.push(intersects[0].point.clone());
      addPointMarker(intersects[0].point);

      if (measurePoints.length === 2) {
        drawMeasureLine();
        saveMeasureDistance();
        measurePoints = [];
      }
    }

    function addPointMarker(point) {
      const sphereGeometry = new THREE.SphereGeometry(1.5, 16, 16);
      const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
      sphere.position.copy(point);
      pointMarkers.push(sphere);
      scene.add(sphere);
    }

    function drawMeasureLine() {
      const lineGeometry = new THREE.BufferGeometry().setFromPoints(measurePoints);
      const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
      const line = new THREE.Line(lineGeometry, lineMaterial);
      measureLines.push(line);
      scene.add(line);
    }

    function saveMeasureDistance() {
      const scaleToMM = Number(scaleInput.value);
      const pA = measurePoints[0];
      const pB = measurePoints[1];
      const distanceMM = pA.distanceTo(pB) * scaleToMM;

      const measurement = {
        id: measureCounter,
        distanceMM: distanceMM,
        p1: { x: pA.x * scaleToMM, y: pA.y * scaleToMM, z: pA.z * scaleToMM },
        p2: { x: pB.x * scaleToMM, y: pB.y * scaleToMM, z: pB.z * scaleToMM }
      };

      measurements.push(measurement);
      measureCounter++;

      status.innerHTML = "<strong>Última medición:</strong> " + distanceMM.toFixed(2) + " mm";
      updateMeasureHistory();
    }

    function updateMeasureHistory() {
      if (measurements.length === 0) {
        measureHistoryBox.innerHTML = "Historial de mediciones: vacío.";
        return;
      }

      let html = "<strong>Historial de mediciones:</strong><br>";
      for (const m of measurements) {
        html +=
          "#" + m.id + ": " + m.distanceMM.toFixed(2) + " mm<br>" +
          "P1: (" + m.p1.x.toFixed(2) + ", " + m.p1.y.toFixed(2) + ", " + m.p1.z.toFixed(2) + ") mm<br>" +
          "P2: (" + m.p2.x.toFixed(2) + ", " + m.p2.y.toFixed(2) + ", " + m.p2.z.toFixed(2) + ") mm<br><br>";
      }
      measureHistoryBox.innerHTML = html;
    }

    function exportMeasurementsCSV() {
      if (measurements.length === 0) {
        status.textContent = "No hay mediciones para exportar.";
        return;
      }

      const rows = [];
      rows.push(["ID", "Distancia_mm", "P1_X_mm", "P1_Y_mm", "P1_Z_mm", "P2_X_mm", "P2_Y_mm", "P2_Z_mm"]);

      for (const m of measurements) {
        rows.push([
          m.id,
          m.distanceMM.toFixed(4),
          m.p1.x.toFixed(4),
          m.p1.y.toFixed(4),
          m.p1.z.toFixed(4),
          m.p2.x.toFixed(4),
          m.p2.y.toFixed(4),
          m.p2.z.toFixed(4)
        ]);
      }

      const csv = rows.map(function (row) {
        return row.join(",");
      }).join(String.fromCharCode(10));

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "mediciones_stl.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function clearMeasurement() {
      for (const line of measureLines) {
        scene.remove(line);
        line.geometry.dispose();
        line.material.dispose();
      }

      for (const marker of pointMarkers) {
        scene.remove(marker);
        marker.geometry.dispose();
        marker.material.dispose();
      }

      measureLines = [];
      pointMarkers = [];
      measurePoints = [];
      measurements = [];
      measureCounter = 1;
      updateMeasureHistory();
      status.textContent = "Arrastra para rotar. Usa la rueda para zoom.";
    }

    function updateSectionCut() {
      if (!currentMesh) return;

      const axis = sectionAxis.value;
      const sliderValue = Number(sectionSlider.value);

      currentMesh.geometry.computeBoundingBox();
      const box = currentMesh.geometry.boundingBox;
      const size = box.getSize(new THREE.Vector3());
      const maxDimension = Math.max(size.x, size.y, size.z) || 1;
      const position = (sliderValue / 100) * (maxDimension / 2);

      if (axis === "none") {
        material.clippingPlanes = [];
        material.needsUpdate = true;
        removeSectionHelper();
        return;
      }

      if (axis === "x") {
        sectionPlane.normal.set(-1, 0, 0);
        sectionPlane.constant = position;
      }

      if (axis === "y") {
        sectionPlane.normal.set(0, -1, 0);
        sectionPlane.constant = position;
      }

      if (axis === "z") {
        sectionPlane.normal.set(0, 0, -1);
        sectionPlane.constant = position;
      }

      material.clippingPlanes = [sectionPlane];
      material.clipShadows = true;
      material.needsUpdate = true;

      removeSectionHelper();
      sectionHelper = new THREE.PlaneHelper(sectionPlane, maxDimension * 1.5, 0xffff00);
      scene.add(sectionHelper);
    }

    function removeSectionHelper() {
      if (sectionHelper) {
        scene.remove(sectionHelper);
        sectionHelper = null;
      }
    }

    function runSimpleSimulation() {
      if (!currentMesh) {
        simulationBox.textContent = "Carga un STL antes de simular.";
        return;
      }

      resetSimulation(false);

      const axis = loadAxis.value;
      const pressureMPa = Number(pressureInput.value) || 0;
      const elasticModulusMPa = Number(elasticModulusInput.value) || 1;
      const yieldStressMPa = Number(yieldStressInput.value) || 1;
      const visualScale = Number(deformationScaleInput.value) || 0;
      const scaleToMM = Number(scaleInput.value);

      currentMesh.geometry.computeBoundingBox();
      const box = currentMesh.geometry.boundingBox;
      const size = box.getSize(new THREE.Vector3());

      const xMM = size.x * scaleToMM;
      const yMM = size.y * scaleToMM;
      const zMM = size.z * scaleToMM;

      let projectedAreaMM2 = 0;
      let lengthMM = 0;

      if (axis === "x") {
        projectedAreaMM2 = yMM * zMM;
        lengthMM = xMM;
      }

      if (axis === "y") {
        projectedAreaMM2 = xMM * zMM;
        lengthMM = yMM;
      }

      if (axis === "z") {
        projectedAreaMM2 = xMM * yMM;
        lengthMM = zMM;
      }

      const forceN = pressureMPa * projectedAreaMM2;
      const strain = pressureMPa / elasticModulusMPa;
      const estimatedDeflectionMM = strain * lengthMM;
      const safetyFactor = pressureMPa > 0 ? yieldStressMPa / pressureMPa : Infinity;
      const statusResult = safetyFactor >= 1 ? "APROBADO preliminar" : "RIESGO de falla preliminar";

      applyVisualDeformation(axis, estimatedDeflectionMM / scaleToMM, visualScale);

      simulationBox.innerHTML =
        "<strong>Resultados aproximados:</strong><br>" +
        "Presión aplicada: " + pressureMPa.toFixed(3) + " MPa<br>" +
        "Área proyectada: " + projectedAreaMM2.toFixed(2) + " mm²<br>" +
        "Fuerza resultante: " + forceN.toFixed(2) + " N<br>" +
        "Deformación estimada: " + estimatedDeflectionMM.toFixed(4) + " mm<br>" +
        "Factor de seguridad: " + (Number.isFinite(safetyFactor) ? safetyFactor.toFixed(2) : "∞") + "<br>" +
        "Resultado: <strong>" + statusResult + "</strong><br><br>" +
        "<small>Modelo simplificado: esfuerzo aproximado. No sustituye un FEA real.</small>";
    }

    function applyVisualDeformation(axis, deflectionModelUnits, visualScale) {
      if (!currentMesh) return;

      const geometry = currentMesh.geometry;
      const position = geometry.attributes.position;
      geometry.computeBoundingBox();
      const box = geometry.boundingBox;

      const axisIndex = axis === "x" ? 0 : axis === "y" ? 1 : 2;
      const min = box.min[axis];
      const max = box.max[axis];
      const range = max - min || 1;

      for (let i = 0; i < position.count; i++) {
        const value = position.getComponent(i, axisIndex);
        const normalized = (value - min) / range;
        const deformation = -deflectionModelUnits * visualScale * normalized;

        if (axis === "x") position.setX(i, position.getX(i) + deformation);
        if (axis === "y") position.setY(i, position.getY(i) + deformation);
        if (axis === "z") position.setZ(i, position.getZ(i) + deformation);
      }

      position.needsUpdate = true;
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();

      material.color.set(getSafetyColor(Number(pressureInput.value), Number(yieldStressInput.value)));
      material.needsUpdate = true;
      showDimensions();
      updateSectionCut();
    }

    function getSafetyColor(pressureMPa, yieldStressMPa) {
      const ratio = yieldStressMPa > 0 ? pressureMPa / yieldStressMPa : 999;
      if (ratio < 0.5) return 0x22c55e;
      if (ratio < 0.85) return 0xfacc15;
      return 0xef4444;
    }

    function resetSimulation(updateText) {
      if (!currentMesh || !originalGeometry) return;

      currentMesh.geometry.dispose();
      currentMesh.geometry = originalGeometry.clone();
      currentMesh.geometry.computeVertexNormals();
      currentMesh.geometry.computeBoundingBox();

      material.color.set(colorInput.value);
      material.needsUpdate = true;

      showDimensions();
      updateSectionCut();

      if (updateText) {
        simulationBox.textContent = "Geometría restaurada.";
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
